<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta data</title>

    <!-- meta data is a hidden information inside code that describes the document but is not visible to regular users 
     
        a named metadata refers to meta tag that has a name attribute to identify the specific type of information being provided, paired with a content attribute to supply the actual value.
    -->

    <!-- author specifies the name of the person or organization that wrote this code -->
    <meta name="author" content="rishabh">

    <!-- description: gives a short summary of the web page -->
    <meta name="description" content="meta data in html">

</head>
<body>
    
</body>
</html>
