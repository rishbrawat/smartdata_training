<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css box model</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- everything in css is a box -->

    <!-- inline style btw -->
    <h1 style="border: 2px solid black; background-color: red;">this is a heading</h1>

    <!-- boxes have their different behavior based on their display value, their set dimensions and the content they contain.
    
    this content could be plain text or more boxes generated by child elements.

    it can be controlled using extrinsic or intrinsic sizing to let the browser make decisions for you, based on the content size.
    -->

    <!-- class selector -->
    <h2 id="awsm">css is awesome</h2>


    <!-- boxes are made up of distinct box model areas that all do a specific job -->
    

    <!-- <img src="https://web.dev/static/learn/css/box-model/image/a-diagram-showing-four-m-af72960a9e79a.svg" alt="box model"> -->
    <!-- the content box is the area that content lives in -->
    <!-- the padding box surrounds  the content box and its space created by the padding property, padding is inside the box. -->
    <!-- the border box surrounds the padding box and its space is defined by the border value here. -->
    <!-- the margin box is the space around the box, defimned by the boxs margin -->


    <!-- by default the box sizing is set to content box  which means when we set dimensions such as width and heigh, those dimesions apply to content box, if you set padding and border these values are added to the content box size -->

    <p class="text-box">This is a box</p>


    <button class="cm-btn">click me!</button>

    <ul class="ulist">
        <li>apple</li>
        <li>mango</li>
        <li>grapes</li>
        <li>papaya</li>
    </ul>
</body>
</html>
