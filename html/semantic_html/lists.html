<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        the <ul> element is the parent of one or more <li> elements.
        we use unordered list cuz the order does not matter
    -->

    <ul>
        <li>blender</li>
        <li>toaster</li>
        <li>air fryer</li>
    </ul>

    <!-- ordered list cuz the order matters 
        <ol> is the parent of one or more list items
            
        its type by default is numeric. we can change it by using type attribute
    -->

    <ol>
        <li>blender</li>
        <li>toaster</li>
        <li>air fryer</li>
    </ol>

    <ol type="i">
        <li>blender</li>
        <li>toaster</li>
        <li>air fryer</li>
    </ol>
    <ol type="a">
        <li>blender</li>
        <li>toaster</li>
        <li>air fryer</li>
    </ol>

    <!-- reveresed boolean if included, reverses the order of the numbers going from largest number to smallest number, the start attributes sets the start value -->

    <ol type="1" reversed start="2">
        <li>blender</li>
        <li>toaster</li>
        <li>air fryer</li>
    </ol>

    <!-- description list <dl> is a element containing a series of 0 or more description terms <dt> and their description details. <dd> -->

    <dl>
        <dt>blendan smooth</dt>
        <dd>a load balancer</dd>
    </dl>
</body>
</html>
