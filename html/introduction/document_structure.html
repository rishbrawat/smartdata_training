<!-- tells the browser to use standards mode, if omitted browser uses a different rendering mode called quirks mode -->
<!DOCTYPE html> 

<!-- <html> </html> root element of an html document, parent of head and body -->
<!-- "lang=en" defines main language-->
<html lang="en">

    <head>

        <!-- the meta charset should come before 'title' so it can render that title efficiently-->
        <meta charset="utf-8"> 

        <!-- document title -->
         <title>Document Structure</title>

        <!-- viewport meta is responsible for making site responsive, ensuring content renders regardless of viewport width
            it controls viewport size and scale, preventing content from shrinking to fit smaller screens. 
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=1">


        <!-- to include a stylesheet -->
        <link rel="stylesheet" href="styles.css">

        <!-- favicon for the site -->
        <link rel="icon" type="image/png" href="https://icons8.com/icon/80449/internet">
    </head>
    <body></body>
</html>
